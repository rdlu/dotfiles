# Bluetooth headsets: never jump to HSP/HFP on their own.
# The headset (narrowband mic) profile sounds awful and another mic is always
# preferred. HSP/HFP stays registered, though: dropping it (hfphsp-backend =
# "none") made headsets that reconnect HFP-first never come back on their own.
wireplumber.settings = {
  # Never jump to the headset profile when an app opens a mic
  bluetooth.autoswitch-to-headset-profile = false
}
