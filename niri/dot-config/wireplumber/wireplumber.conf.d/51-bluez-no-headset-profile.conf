# Bluetooth headsets: A2DP / LE Audio only, never HSP/HFP.
# The headset (narrowband mic) profile sounds awful and another mic is always
# preferred, so drop the HSP/HFP roles entirely instead of just not switching.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source ]
  bluez5.hfphsp-backend = "none"
}

wireplumber.settings = {
  # Belt and braces: never jump to the headset profile when an app opens a mic
  bluetooth.autoswitch-to-headset-profile = false
}
