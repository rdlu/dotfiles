# Bluetooth headsets default to SBC-XQ: near-aptX quality at SBC latency
# (LDAC, WirePlumber's own pick, buffers the most — bad for gaming).
# Only used when no profile is stored for the device: picking another one by
# hand is remembered and wins until the state file forgets it.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        priorities = [ a2dp-sink-sbc_xq a2dp-sink-sbc ]
      }
    }
  }
]
