# Noctalia v5 (bar, notifications, wallpaper, night light). Validate with
# `noctalia config validate`; it warns on unknown keys and values.

[wallpaper]
enabled = true
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"
transition_on_startup = false

[wallpaper.automation]
enabled = true
interval_seconds = 3600
order = "random"
recursive = true

[nightlight]
enabled = true
temperature_day = 6500
temperature_night = 4000

[location]
custom_schedule = true
sunrise = "05:45"
sunset = "18:00"

[shell]
font_family = "iMWritingDuo Nerd Font Propo"
polkit_agent = true # replaces plasma-polkit-agent.service; only one agent per session

[shell.animation]
enabled = true
speed = 3.0 # speed multiplier for all animations, notifications included

# Same folder and filenames as niri's own screenshot-path (Alt+Print).
[shell.screenshot]
directory = "~/Pictures/Screenshots"
filename_pattern = "Screenshot from %Y-%m-%d %H-%M-%S"
save_to_file = true
copy_to_clipboard = true
freeze_screen = true

[theme]
source = "builtin"
builtin = "Tokyo-Night"
pure_black_dark = true

[theme.templates]
enable_community_templates = true
community_ids = ["fuzzel"]
# Colours only: desktop-theme still picks the themes (desktop-theme.conf).
# gtk3/gtk4 import noctalia.css on top of adw-gtk3; kcolorscheme renders
# ~/.local/share/color-schemes/noctalia.colors for kde_scheme=noctalia; qt
# renders qt6ct/colors/noctalia.conf (qt6ct.conf, QT_QPA_PLATFORMTHEME).
# KDE apps with their own colour-scheme menu (Okular, Krita) ignore all of
# this off Plasma and fall back to light Breeze: pick "noctalia" in that menu.
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "kcolorscheme", "qt"]

[lockscreen]
fingerprint = true # fprintd alongside the password
transition = ["fade"] # one entry = fixed style; else picked at random
transition_duration = 250 # ms

[bar.default]
position = "bottom"
background_opacity = 0.7
margin_ends = 16
font_scale = 1.1 # iMWritingDuo has no medium weight and bar font_weight had no visible effect
center = [ "active_window", "spacer_2", "media" ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session",
    "clock",
]

# Instances referenced by name in the bar lists above.
[widget.spacer_2]
type = "spacer"

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true # external monitors over DDC/CI (ddcutil is in packages.yaml)

[calendar]
enabled = true

[control_center.calendar]
show_week_numbers = true

[notification]
follow_focused_output = true
