# Noctalia v5 (bar, notifications, wallpaper, night light). Validate with
# `noctalia config validate`; it warns on unknown keys and values.

[wallpaper]
enabled = true
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"
transition_on_startup = false

[wallpaper.automation]
enabled = true
interval_seconds = 3600
order = "random"
recursive = true

[nightlight]
enabled = true
temperature_day = 6500
temperature_night = 4000

[location]
custom_schedule = true
sunrise = "05:45"
sunset = "18:00"

[shell]
launch_apps_as_systemd_services = true # own unit per app, so restarting noctalia.service no longer kills them
font_family = "iMWritingDuo Nerd Font Propo"
polkit_agent = true # replaces plasma-polkit-agent.service; only one agent per session

# Bar panels open next to the icon you clicked, not at the bar's centre.
# Launcher and clipboard stay floating at screen centre (Mod+D, Mod+V); the
# open_near_click_* switch is ignored for floating panels pinned to "center".
[shell.panel]
open_near_click_control_center = true
open_near_click_wallpaper = true
open_near_click_session = true

[shell.animation]
enabled = true
speed = 3.0 # speed multiplier for all animations, notifications included

# Same folder and filenames as niri's own screenshot-path (Alt+Print).
[shell.screenshot]
directory = "~/Pictures/Screenshots"
filename_pattern = "Screenshot from %Y-%m-%d %H-%M-%S"
save_to_file = true
copy_to_clipboard = true
freeze_screen = true

[theme]
source = "builtin"
builtin = "Tokyo-Night"
pure_black_dark = true

[theme.templates]
enable_community_templates = true
community_ids = ["fuzzel"]
# Colours only: desktop-theme still picks the themes (desktop-theme.conf).
# gtk3/gtk4 import noctalia.css on top of adw-gtk3; kcolorscheme renders
# ~/.local/share/color-schemes/noctalia.colors for kde_scheme=noctalia; qt
# renders qt6ct/colors/noctalia.conf (qt6ct.conf, QT_QPA_PLATFORMTHEME).
# KDE apps with their own colour-scheme menu (Okular, Krita) ignore all of
# this off Plasma and fall back to light Breeze: pick "noctalia" in that menu.
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "kcolorscheme", "qt"]

# Idle (replaces swayidle). Idle inhibitors hold it off: Noctalia's caffeine
# (`caffeine` / `noctalia msg caffeine-toggle`) and apps playing video.
[idle]
behavior_order = ["lock", "screen-off"]
pre_action_fade_seconds = 5 # dim first; any input cancels

[idle.behavior.lock]
action = "lock"
timeout = 300

[idle.behavior.screen-off]
action = "screen_off" # monitors back on with the first input
timeout = 600

[lockscreen]
fingerprint = true # fprintd alongside the password
transition = ["fade"] # one entry = fixed style; else picked at random
transition_duration = 250 # ms

[bar.default]
position = "bottom"
background_opacity = 0.7
padding = 16
margin_edge = 4
margin_ends = 2
margin_opposite_edge = 2
concave_edge_corners = false
font_scale = 1.1 # iMWritingDuo has no medium weight and bar font_weight had no visible effect
start = [ "control-center", "launcher", "wallpaper", "workspaces", "taskbar", "media" ]
center = []
end = [
    "group:tray",
    "group:tools",
    "notifications",
    "group:connectivity",
    "group:controls",
    "group:power",
    "world_clock", # plugin: click for the zones panel
    "clock",
]

# Capsule groups: widgets sharing one pill. Accordion groups collapse to their
# first widget and unfold on hover. Built in Settings → Bar → Bar Widgets.
[[bar.default.capsule_group]]
id = "tray"
members = [ "tray" ]

[[bar.default.capsule_group]]
id = "tools"
members = [ "clipboard", "recorder", "claude_sessions" ]
accordion = true

[[bar.default.capsule_group]]
id = "connectivity"
members = [ "network", "bluetooth" ]

[[bar.default.capsule_group]]
id = "controls"
members = [ "volume", "brightness" ]

[[bar.default.capsule_group]]
id = "power"
members = [ "battery", "power_profile", "caffeine" ] # caffeine = idle inhibitor
accordion = true

# Tray icons live in a drawer behind one button.
[widget.tray]
drawer = true

# Icons for the windows on the current workspace, so columns scrolled off
# screen stay one click away. Click focuses, middle-click closes.
[widget.taskbar]
only_active_workspace = true
show_window_title = true
inactive_opacity = 0.5 # dims unfocused windows

# Workspace pills show niri's workspace names (base, brain, comms, games;
# unnamed ones fall back to their number).
[widget.workspaces]
label_source = "name"
max_label_chars = 6

# Bar button of the screen_recorder plugin (gpu-screen-recorder). Its codec,
# folder etc. are plugin settings, kept in the state dir, not here.
[widget.recorder]
type = "noctalia/screen_recorder:recorder"

# World clock plugin. Its zones are runtime state, not config:
# ~/.local/state/noctalia/plugins/data/noctalia/world_clock/zones.json,
# seeded from ztl's zones (terminal/dot-config/zonetimeline-tui/config.toml).
[widget.world_clock]
type = "noctalia/world_clock:bar"

# claude-sessions plugin: live Claude Code sessions, plan limits; /cs searches.
[widget.claude_sessions]
type = "lfdominguez/claude-sessions:bar"

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true # external monitors over DDC/CI (ddcutil is in packages.yaml)

[calendar]
enabled = true

# Events from the Google calendars vdirsyncer already syncs for khal/chroncal
# (vdirsyncer.timer, every 15 min), so no second Google login. Names come
# from each calendar's displayname file.
[calendar.account.google]
type = "vdir"
name = "Google"
path = "~/.local/share/calendars/google"
calendars = [] # all

[control_center.calendar]
show_week_numbers = true

[notification]
follow_focused_output = true

# Plugins come from the official/community git catalogs. The GUI writes its own
# toggles to ~/.local/state/noctalia/settings.toml; this list is merged with it.
[plugins]
enabled = [ "noctalia/translator", "noctalia/screen_recorder", "noctalia/world_clock", "rdlu/bitwarden", "kenn/keybind-cheatsheet", "lfdominguez/claude-sessions" ]

# Declaring any source replaces the built-in list, so official and community
# are spelled out too. "local" = forks stowed from this repo.
[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
enabled = true

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
enabled = true

# rdlu/bitwarden = noctalia/bitwarden with fuzzy matching in /bw (actions and
# vault items ranked by what you type).
[[plugins.source]]
name = "local"
kind = "path"
location = "~/.config/noctalia/plugins"
enabled = true

