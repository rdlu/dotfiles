[bar.default]
position = "bottom"
background_opacity = 0.7
padding = 16
margin_edge = 0 # flush against the screen edge
margin_ends = 2
margin_opposite_edge = 2
concave_edge_corners = true
capsule_thickness = 0.86
font_scale = 1.1 # iMWritingDuo has no medium weight and bar font_weight had no visible effect
start = [ "control-center", "launcher", "wallpaper", "workspaces", "taskbar" ]
center = []
end = [
    "media",
    "group:system",
    "group:tray",
    "group:tools",
    "notifications",
    "group:connectivity",
    "group:controls",
    "group:power",
    "group:time",
]

# Capsule groups: widgets sharing one pill. Accordion groups collapse to their
# first widget and unfold on hover. Built in Settings → Bar → Bar Widgets.
# opacity is per group: bar-level capsule_opacity does not reach grouped pills.
[[bar.default.capsule_group]]
id = "tray"
opacity = 0.4
members = [ "tray" ]

[[bar.default.capsule_group]]
id = "tools"
opacity = 0.4
members = [ "clipboard", "recorder", "claude_sessions" ]
accordion = true

[[bar.default.capsule_group]]
id = "connectivity"
opacity = 0.4
members = [ "network", "bluetooth" ]

[[bar.default.capsule_group]]
id = "controls"
opacity = 0.4
members = [ "volume", "brightness" ]

[[bar.default.capsule_group]]
id = "power"
opacity = 0.4
members = [ "battery", "power_profile", "caffeine" ] # caffeine = idle inhibitor
accordion = true

# Pomodoro and world clock (plugins) share the clock's pill.
[[bar.default.capsule_group]]
id = "time"
opacity = 0.4
members = [ "pomodoro", "world_clock", "clock" ]

# System stats, collapsed to the temperature until hovered.
[[bar.default.capsule_group]]
id = "system"
opacity = 0.4
members = [ "temp", "cpu", "ram", "network_tx", "network_rx" ]
accordion = true

[widget.media]
art_size = 33
artist_first = true
capsule = true
capsule_fill = "shadow"
color = "surface"
font_family = "IosevkaTerm Nerd Font Propo"
font_weight = 300
hide_when_no_media = true
max_length = 304
rotate_album_art = true
show_progress = true
title_scroll = "always"

# Tray icons live in a drawer behind one button.
[widget.tray]
drawer = true

# Icons for the windows on the current workspace, so columns scrolled off
# screen stay one click away. Click focuses, middle-click closes.
[widget.taskbar]
only_active_workspace = true
show_window_title = true
inactive_opacity = 0.5 # dims unfocused windows

# Workspace pills show niri's workspace names (base, brain, comms, games;
# unnamed ones fall back to their number).
[widget.workspaces]
label_source = "name"
max_label_chars = 6

# Bar button of the screen_recorder plugin (gpu-screen-recorder). Its codec,
# folder etc. are plugin settings, kept in the state dir, not here.
[widget.recorder]
type = "noctalia/screen_recorder:recorder"
# Middle click: start/stop the replay buffer. The plugin's own middle-click
# (save replay) never fires, Noctalia's default middle=settings wins; right
# click still starts the buffer and saves a replay while it runs.
[widget.recorder.actions]
middle = "plugin noctalia/screen_recorder:service all replay-toggle"

# World clock plugin. Its zones are runtime state, not config:
# ~/.local/state/noctalia/plugins/data/noctalia/world_clock/zones.json,
# seeded from ztl's zones (terminal/dot-config/zonetimeline-tui/config.toml).
[widget.world_clock]
type = "noctalia/world_clock:bar"

# claude-sessions plugin: live Claude Code sessions, plan limits; /cs searches.
[widget.claude_sessions]
type = "lfdominguez/claude-sessions:bar"

# Pomodoro plugin (25/5/15, long break every 4). No session history of its own.
[widget.pomodoro]
type = "thepunkoff/pomodoro:widget"

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true # external monitors over DDC/CI (ddcutil is in packages.yaml)

[calendar]
enabled = true

[calendar.reminders]
all_day_digest_time = "07:30" # one morning notification listing all-day events

# from each calendar's displayname file.
[calendar.account.google]
type = "vdir"
path = "~/.local/share/calendars/google"
calendars = [] # all

[control_center.calendar]
show_week_numbers = true

# Volume/brightness OSD only on the laptop panel.
[osd]
monitors = ["eDP-1"]
scale = 1.25

[notification]
follow_focused_output = true
# First matching enabled filter wins; unmatched notifications would beep, so
# the list ends in a silent catch-all and only the senders above it play sound.
filter_order = ["loud_yubikey", "loud_slack", "loud_calendar", "loud_battery", "quiet_rest"]

# yubikey-touch-notifier (scripts/) sends as "YubiKey-detector", urgency low.
[notification.filter.loud_yubikey]
enabled    = true
match      = "yubikey"
play_sound = true

[notification.filter.loud_slack]
enabled    = true
match      = "slack"
play_sound = true

# Noctalia's own event reminders ("Starts in 10 min · 14:00"); the all-day
# digest stays quiet.
[notification.filter.loud_calendar]
enabled       = true
match_content = "^Starts (in [0-9]+ min|now) ·"
play_sound    = true

# Noctalia's own "Battery low" (at [battery] warning_threshold) and
# "Battery critically low" toasts, matched on the title.
[notification.filter.loud_battery]
enabled       = true
match_content = "^Battery (low|critically low)$"
play_sound    = true

# Also silences shell/plugin toasts. The pomodoro alarm plays its own file, and
# herdr ([ui.sound], on by default) beeps itself for background workspaces only.
[notification.filter.quiet_rest]
enabled       = true
match_content = ".*"
play_sound    = false

# Plugins come from the official/community git catalogs. The GUI writes its own
# toggles to ~/.local/state/noctalia/settings.toml; this list is merged with it.
[plugins]
enabled = [ "noctalia/translator", "noctalia/screen_recorder", "noctalia/world_clock", "rdlu/bitwarden", "kenn/keybind-cheatsheet", "lfdominguez/claude-sessions", "thepunkoff/pomodoro" ]

# Declaring any source replaces the built-in list, so official and community
# are spelled out too. "local" = forks stowed from this repo.
[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
enabled = true

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
enabled = true

# rdlu/bitwarden = noctalia/bitwarden with fuzzy matching in /bw (actions and
# vault items ranked by what you type).
[[plugins.source]]
name = "local"
kind = "path"
location = "~/.config/noctalia/plugins"
enabled = true

# The alarm plays its bundled file via ffplay, independent of shell sounds and
# of the notification filters above.
[plugin_settings."thepunkoff/pomodoro"]
use-bundled-alarm-sound = true
bypass-noctalia-sound-globals = true
