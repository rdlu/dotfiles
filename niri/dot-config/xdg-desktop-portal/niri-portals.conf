# User override of /usr/share/xdg-desktop-portal/niri-portals.conf.
#
# Identical to the system file except for the Secret line: gnome-keyring
# was replaced by oo7, so the packaged routing points at a provider that
# no longer exists. Re-sync the rest of this file if xdg-desktop-portal
# changes its niri defaults.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;
