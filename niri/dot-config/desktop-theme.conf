# Desktop theme for GTK + Qt/KDE apps (niri has no settings app). Stowed to
# ~/.config/desktop-theme.conf and applied by `desktop-theme` (or `mise run
# theme`). `desktop-theme dark|light|toggle` switches mode and its
# gtk_theme/kde_scheme/kde_icon_theme defaults; `desktop-theme set KEY VALUE`
# changes one key; both rewrite this file through the stow symlink.
# `desktop-theme list` shows what is installed.
#   gtk_theme      -> /usr/share/themes/<name>               (adw-gtk3*: pkg adw-gtk-theme)
#   kde_scheme     -> /usr/share/color-schemes/<name>.colors (KvGnome*: pkg kvantum)
#   icon_theme     -> /usr/share/icons/<name>/index.theme    (GTK apps only)
#   kde_icon_theme -> /usr/share/icons/<name>/index.theme    (kdeglobals; breeze*:
#                     pkg breeze-icons. Not Adwaita: it lacks KDE icon names, so
#                     KDE apps upscale its 16px fallbacks and look blurry)
#   cursor_theme   -> /usr/share/icons/<name>/cursors        (also niri's cursor)
mode=dark
gtk_theme=Materia
kde_scheme=Kvantum
icon_theme=Papirus-Dark
kde_icon_theme=Papirus-Dark
cursor_theme=Adwaita
cursor_size=32
