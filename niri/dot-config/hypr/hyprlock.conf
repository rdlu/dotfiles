# hyprlock — screen locker (replaces swaylock).
# Chosen over swaylock because swaylock discards PAM text messages, so it can
# never tell you *why* auth failed. hyprlock renders the PAM/faillock reason via
# $FAIL and the running count via $ATTEMPTS, so a faillock lockout
# ("Account locked due to N failed logins") shows up on the lock screen itself.
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot        # blur the current screen, like the old swaylock effect-blur
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.17
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(D8DEE9)
    font_size = 52
    font_family = iMWritingDuo Nerd Font Propo
    position = 0, 130
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(D8DEE9)
    font_size = 20
    font_family = iMWritingDuo Nerd Font Propo
    position = 0, 70
    halign = center
    valign = center
}

# Password input.
# fail_text uses $FAIL (the PAM/faillock reason) and $ATTEMPTS (running count) —
# this is the whole point of the switch: a lockout is now spelled out on screen.
input-field {
    monitor =
    size = 340, 55
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.25
    dots_center = true
    rounding = 12

    outer_color = rgb(4C566A)
    inner_color = rgb(3B4252)
    font_color = rgb(D8DEE9)
    font_family = iMWritingDuo Nerd Font Propo
    check_color = rgb(EBCB8B)     # amber ring while verifying
    fail_color = rgb(BF616A)      # red ring on failure / lockout

    placeholder_text = <i>Password…</i>
    fail_text = <b>$FAIL</b>  (attempt $ATTEMPTS)
    fail_timeout = 10000          # keep the reason on screen 10s so it's readable
    hide_input = false

    position = 0, -20
    halign = center
    valign = center
}
