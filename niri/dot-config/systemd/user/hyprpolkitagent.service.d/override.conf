# Style the hyprpolkitagent auth dialog.
#
# hyprpolkitagent is a Qt6 Quick Controls 2 app and honors QT_QUICK_CONTROLS_STYLE.
# We set the Material style + colors here as a systemd DROP-IN so the styling is
# scoped to THIS service only — setting these globally (e.g. in niri's environment
# block) would also restyle other Qt-Quick apps like quickshell.
#
# Palette matches the hyprlock look (Nord-ish): green accent, dark blue-grey base.
# Change the ACCENT hex to recolor the prompt; VARIANT=Dense tightens the padding.
[Service]
Environment=QT_QUICK_CONTROLS_STYLE=Material
Environment=QT_QUICK_CONTROLS_MATERIAL_THEME=Dark
Environment=QT_QUICK_CONTROLS_MATERIAL_ACCENT=#A3BE8C
Environment=QT_QUICK_CONTROLS_MATERIAL_PRIMARY=#3B4252
Environment=QT_QUICK_CONTROLS_MATERIAL_VARIANT=Dense
