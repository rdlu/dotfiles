
[main]
anchor = center
#font = MonaspiceNeNF:size=14
font = iMWritingDuo Nerd Font Propo:size=14
dpi-aware = no
# Used for Terminal=true entries: fuzzel appends the Exec line, so ghostty
# needs -e or it parses the command as a config key ("rmpc: invalid field").
terminal = ghostty -e
#y-margin = 128
width = 60
inner-pad = 8
horizontal-pad = 18
vertical-pad = 12
line-height = 32
lines = 10
icon-theme = Papirus
# Default is filename,name,generic; adding keywords lets "files", "explorer",
# "agenda" etc. find launchers whose Name doesn't say it (yazi, khal...).
fields = filename,name,generic,keywords

# Colours come from Noctalia's fuzzel template, which renders the current
# palette here on every theme change. Its apply.sh hook rewrites this file
# unless this exact line is present, so keep it verbatim. Without Noctalia the
# file is missing and fuzzel ignores this whole config.
include=/home/rdlu/.config/fuzzel/themes/noctalia

[border]
width = 2
radius = 8
