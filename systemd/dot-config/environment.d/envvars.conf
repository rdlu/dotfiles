QT_QPA_PLATFORM=wayland
EXQLITE_USE_SYSTEM=1
EXQLITE_SYSTEM_CFLAGS=-I/usr/include
EXQLITE_SYSTEM_LDFLAGS=-L/lib -lsqlite3

# niri and everything it spawns inherit PATH from the systemd user manager,
# which does not include ~/.local/bin -- so a bare script name from there
# (ssh-here, localsend-here, caffeine) silently fails to resolve in menus and
# keybinds. Needs a re-login to take effect.
PATH=${HOME}/.local/bin:${PATH}
