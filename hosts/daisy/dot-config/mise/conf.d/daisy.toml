# daisy-only mise tools. Merged additively on top of ~/.config/mise/config.toml.
# Only present on daisy (this overlay is stowed only there).
[tools]
"cargo:probe-rs-tools" = "latest"  # microcontroller side project

# rustlock: Rust Wayland screen locker (swaylock-effects-inspired), built from
# OUR fork rdlu/rustlock which adds PAM message display — the faillock lockout
# notice now renders on the lock screen (upstream/swaylock drop it). Not on
# crates.io, so the cargo backend builds from the fork's master HEAD. NOT the
# active locker — swaylock is (it blanks while locked; rustlock renders
# continuously). Kept for testing. Feature branch: pam-message-display.
# Daisy-only while under test (this overlay is stowed only there).
"cargo:https://github.com/rdlu/rustlock" = "HEAD"

# chroncal: Go TUI/CLI calendar with built-in CalDAV + Google OAuth. Trialing
# against khal+vdirsyncer (packages.yaml `calendar`); keep only the winner.
# Daisy-only while under test.
"github:DouglasdeMoura/chroncal" = { version = "latest", bin = "chroncal", matching_regex = "linux_amd64\\.tar\\.gz$" }

# emeraldian: Obsidian-vault TUI (live preview, backlinks, kitty-graphics
# images). Trialing against clin over Suika Box; keep only the winner. Its
# config rewrites itself, so it stays unstowed in ~/.config/emeraldian, with
# the assistant set to provider = "offline". Daisy-only while under test.
"github:iamrohithrnair/emeraldian" = { version = "latest", bin = "emeraldian", matching_regex = "x86_64-unknown-linux-gnu\\.tar\\.gz$" }
