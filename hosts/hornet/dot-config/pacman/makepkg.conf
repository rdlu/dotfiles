# hornet (Core Ultra 7 255HX, Arrow Lake-HX = arrowlake-s silicon).
# makepkg reads this after /etc/makepkg.conf and /etc/makepkg.conf.d/*.conf.
#
# CachyOS ships -march=native / target-cpu=native. That bakes in whatever CPU
# the disk is sitting in at build time: AUR packages built while this SSD was
# in daisy (AMD Zen) used SSE4a (extrq) and died with SIGILL here. Pin the
# target to this CPU by name instead. No AVX-512 on Arrow Lake, so these
# builds won't run on anything older/AMD; rebuild AUR packages if the disk moves.
CFLAGS="-march=arrowlake-s -mtune=arrowlake-s -O3 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
RUSTFLAGS="-C opt-level=3 -C target-cpu=arrowlake-s"
