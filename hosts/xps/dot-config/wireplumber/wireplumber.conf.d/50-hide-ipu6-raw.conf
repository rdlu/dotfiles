# The IPU6 exposes ~32 raw ISYS capture nodes (/dev/video*) that are useless
# on their own; the internal camera (ov01a10) is served by the libcamera
# monitor instead. Hide the raw nodes so apps/browsers list one camera.
# They must stay user-readable for libcamera, so this can't be a udev rule.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.pci-0000_00_05.0.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
