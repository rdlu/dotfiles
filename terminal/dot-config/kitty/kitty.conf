# font_family RecMonoLinear Nerd Font Mono
# font_family JetBrainsMono NF Light
# font_features JetBrainsMono NF Light -calt -clig -liga
font_size 14.0
startup_session ~/.dotfiles/terminal/dot-config/kitty/tmux_session.conf
#startup_session ~/.dotfiles/terminal/dot-config/kitty/zellij_session.conf

background_opacity 0.9
hide_window_decorations yes

# Text blending weight: "<gamma> <extra contrast %>". 1.0 0 is the thinnest
# (gamma-correct, like ghostty's linear blending); default "platform" is
# heavier, "legacy" (=1.7 30) heaviest. Tune upward if text gets too faint.
text_composition_strategy 1.0 0

# load_config ~/.dotfiles/terminal/.config/kitty/tokyonight_night.conf


# NFM = Nerd Font Mono. The previous 'JetBrainsMono NFP' was the
# PROPORTIONAL variant — kitty squeezing it into the cell grid is what made
# text look blurred/smudged next to ghostty's real JetBrains Mono.
# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono NFM'
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
