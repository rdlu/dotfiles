# User-level overrides, merged over /usr/share/containers/containers.conf.
# Only the keys set here differ from the packaged defaults.

[engine]
# `docker compose` (the podman-docker wrapper) shells out to podman-compose and
# announces it on every single invocation:
#
#   >>>> Executing external compose provider "/usr/bin/podman-compose". <<<<
#
# Every dkc* abbreviation in fish/aliases.d/containers.fish goes through that
# path, so the banner lands on routine commands. The provider is still used --
# this only silences the notice.
compose_warning_logs = false
